<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Terms of Use – Video to Pic</title>
  <link rel="canonical" href="https://videotophoto.app/terms">
  <script>
    // The terms moved to videotophoto.app. Open them in the first of the
    // reader's languages that the site has, or in English.
    (function () {
      var page = "/terms";
      var languages = ["ar", "ca", "cs", "da", "de", "el", "fi", "he", "hr", "hu",
        "id", "it", "ja", "ko", "ms", "nb", "nl", "pl", "ro", "ru", "sk", "sl",
        "sv", "th", "tr", "uk", "vi"];
      // Same as the site: Spanish in Latin America and the US gets the Mexican
      // pages, and Portuguese outside Brazil gets Portugal's.
      var mexicanSpanish = ["419", "ar", "bo", "cl", "co", "cr", "do", "ec", "gt",
        "hn", "mx", "ni", "pa", "pe", "pr", "py", "sv", "us", "uy", "ve"];

      function prefixFor(tag) {
        var parts = tag.toLowerCase().split("-");
        var language = parts[0] === "no" || parts[0] === "nn" ? "nb" : parts[0];
        var script = "";
        var region = "";
        for (var i = 1; i < parts.length; i++) {
          if (parts[i].length === 4) script = parts[i];
          else if (!region) region = parts[i];
        }
        if (language === "en") return "";
        if (language === "zh") {
          var traditional = script ? script === "hant" : /^(tw|hk|mo)$/.test(region);
          return traditional ? "/zh-hant" : "/zh-hans";
        }
        if (language === "pt") return region === "br" ? "/pt-br" : "/pt-pt";
        if (language === "fr") return region === "ca" ? "/fr-ca" : "/fr";
        if (language === "es") return mexicanSpanish.indexOf(region) >= 0 ? "/es-mx" : "/es";
        return languages.indexOf(language) >= 0 ? "/" + language : null;
      }

      var preferred = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];
      var prefix = "";
      for (var i = 0; i < preferred.length; i++) {
        var match = prefixFor(preferred[i]);
        if (match !== null) {
          prefix = match;
          break;
        }
      }
      location.replace("https://videotophoto.app" + prefix + page);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://videotophoto.app/terms"></noscript>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <p>The Video to Pic Terms of Use are now at <a href="https://videotophoto.app/terms">videotophoto.app/terms</a>.</p>
</body>
</html>
